name: HarmonyQ CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 fetches full history (needed for blame on PRs).
          # On push to main we only need the tip commit; set to 1 to skip
          # fetching thousands of commits which bloats runner startup time.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # Pre-warm Node.js so the Sonar embedded-Node provisioning step is skipped
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  song-catalog:
    name: song-catalog - Build / Scan / Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/song-catalog/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Push to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/song-catalog-service:latest

  user-profile:
    name: user-profile - Build / Scan / Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/user-profile/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Push to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/user-profile-service:latest

  playlist:
    name: playlist - Build / Scan / Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/playlist/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/playlist-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/playlist-service:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Push to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/playlist-service:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_LOGIN_SERVER }}/playlist-service:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/playlist-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/playlist-service:latest

  recommendation:
    name: recommendation - Build / Scan / Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/recommendation/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Push to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/recommendation-service:latest

  frontend:
    name: frontend - Build / Scan / Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_SONG_CATALOG_URL=/api/songs
            VITE_USER_PROFILE_URL=/api/users
            VITE_PLAYLIST_URL=/api/playlists
            VITE_RECOMMENDATION_URL=/api/recommendations
          tags: ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Push to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} \
                     ${{ env.ACR_LOGIN_SERVER }}/frontend:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

  deploy:
    name: Deploy to DigitalOcean Kubernetes
    runs-on: ubuntu-latest
    needs: [song-catalog, user-profile, playlist, recommendation, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ef8015fc-05c5-498d-abce-0a93e92ebb58

      - name: Deploy (Rollout Restart)
        run: |
          kubectl rollout restart deployment -n melodai song-catalog-deployment user-profile-deployment playlist-deployment recommendation-deployment frontend-deployment
          kubectl rollout status deployment -n melodai frontend-deployment --timeout=120s

