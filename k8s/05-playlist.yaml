apiVersion: apps/v1
kind: Deployment
metadata:
  name: playlist-deployment
  namespace: melodai
  labels:
    app: playlist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playlist
  template:
    metadata:
      labels:
        app: playlist
    spec:
      imagePullSecrets:
      - name: acr-pull-secret
      containers:
      - name: playlist
        image: harmoniq.azurecr.io/playlist-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGODB_URI_PLAYLIST
        - name: CLERK_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CLERK_JWKS_URL
        - name: PORT
          value: "3003"
---
apiVersion: v1
kind: Service
metadata:
  name: playlist-service
  namespace: melodai
spec:
  selector:
    app: playlist
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP
