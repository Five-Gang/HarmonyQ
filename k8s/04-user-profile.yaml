apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-deployment
  namespace: melodai
  labels:
    app: user-profile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-profile
  template:
    metadata:
      labels:
        app: user-profile
    spec:
      imagePullSecrets:
      - name: acr-pull-secret
      containers:
      - name: user-profile
        image: harmoniq.azurecr.io/user-profile-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGODB_URI_USER_PROFILE
        - name: CLERK_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CLERK_PUBLISHABLE_KEY
        - name: CLERK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CLERK_SECRET_KEY
        - name: CLERK_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CLERK_JWKS_URL
        - name: PORT
          value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-service
  namespace: melodai
spec:
  selector:
    app: user-profile
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
  type: ClusterIP
