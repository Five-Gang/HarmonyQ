<svg viewBox="0 0 768 768" xmlns="http://www.w3.org/2000/svg">
  <!-- Left side rounded rectangle (red to orange to pink/purple) -->
  <rect x="260" y="200" width="80" height="250" rx="40" fill="url(#gradient1)" />
  
  <!-- Right side rounded rectangle (green to blue) -->
  <rect x="428" y="200" width="80" height="250" rx="40" fill="url(#gradient2)" />
  
  <!-- Center rounded rectangle (orange/yellow) -->
  <rect x="344" y="275" width="80" height="100" rx="40" fill="url(#gradient3)" />
  
  <!-- Black circles for headphone design -->
  <circle cx="300" cy="340" r="25" fill="black" />
  <circle cx="468" cy="340" r="25" fill="black" />
  <circle cx="360" cy="395" r="20" fill="black" />
  <circle cx="408" cy="395" r="20" fill="black" />
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCA5A5;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>