# ─────────────────────────────────────────────────────────
# SonarQube / SonarCloud Project Configuration
# HarmonyQ – Microservices Monorepo
# ─────────────────────────────────────────────────────────

# Project identification
sonar.projectKey=Gaya2001_microservices-test
sonar.projectName=HarmonyQ
sonar.projectVersion=1.0

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Source directories (relative to project root)
sonar.sources=services/song-catalog/src,services/user-profile/src,services/playlist/src,services/recommendation/src,frontend/src

# Test directories (add when you have tests)
# sonar.tests=services/song-catalog/tests

# Exclusions – node_modules, dist, and generated files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.env*,\
  **/coverage/**,\
  **/*.min.js,\
  **/public/**

# Coverage reports (update path when you add Jest)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js

# Enable ES module support
sonar.javascript.environments=node,browser
