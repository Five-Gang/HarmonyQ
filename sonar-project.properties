sonar.projectKey=Five-Gang_HarmonyQ
sonar.organization=five-gang
sonar.projectName=HarmonyQ
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Source directories (backend services + frontend)
sonar.sources=services/song-catalog/src,services/user-profile/src,services/playlist/src,services/recommendation/src,frontend/src

# Test directories – helps Jasmin/security sensor skip taint analysis on test files
sonar.tests=services/song-catalog/src,services/user-profile/src,services/playlist/src,services/recommendation/src,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/__tests__/**,**/test/**,**/tests/**,**/mock*/**,**/mocks/**

# Exclusions – skip generated/vendored/env/min/build artefacts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.env*,\
  **/coverage/**,\
  **/*.min.js,\
  **/public/**,\
  **/build-wrapper-dump.json,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/__tests__/**,\
  **/setupTests.*

# Duplication: skip test files from CPD
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# JS/JSX environments
sonar.javascript.environments=node,browser

# Allow the Node.js analysis process more heap so it doesn't GC-thrash on 78 files.
# The GH Actions ubuntu-latest runner has ~7 GB RAM; 3072 MB leaves plenty for the JVM.
sonar.javascript.node.maxspace=3072

# Coverage reports generated by Jest (lcov format) for each service
sonar.javascript.lcov.reportPaths=\
  services/song-catalog/coverage/lcov.info,\
  services/user-profile/coverage/lcov.info,\
  services/playlist/coverage/lcov.info,\
  services/recommendation/coverage/lcov.info
